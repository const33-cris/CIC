<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Codice di Diritto Canonico</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6b1d3a">
<style>
:root {
  --primary: #6b1d3a;
  --bg: #faf8f5;
  --card: #ffffff;
  --text: #2c2c2c;
  --border: #e8e0d8;
  --header-height: 70px;
  --nav-height: 60px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-bottom: var(--nav-height);
}
header {
  position: sticky;
  top: 0;
  background: var(--primary);
  color: white;
  padding: 12px 16px;
  text-align: center;
  z-index: 100;
}
header h1 { font-size: 18px; font-weight: 600; }
header p { font-size: 12px; opacity: 0.9; margin-top: 2px; }
.search-box {
  padding: 12px 16px;
  background: var(--bg);
  position: sticky;
  top: 56px;
  z-index: 90;
}
.search-box input {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 16px;
  background: white;
}
.lang-switcher {
  display: flex;
  gap: 8px;
  padding: 8px 16px 12px;
  justify-content: center;
  background: var(--bg);
}
.lang-btn {
  padding: 6px 16px;
  border: 1px solid var(--border);
  background: white;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
}
.lang-btn.active {
  background: var(--primary);
  color: white;
  border-color: var(--primary);
}
.section-header {
  text-align: center;
  padding: 16px;
  font-weight: 600;
  color: var(--primary);
  font-size: 15px;
}
.canon-card {
  background: var(--card);
  margin: 8px 16px;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.canon-header {
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-weight: 600;
  color: var(--primary);
}
.canon-body {
  padding: 0 16px 16px;
  display: none;
  line-height: 1.5;
}
.canon-card.open .canon-body { display: block; }
.latin-text {
  display: none;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid #eee;
  font-style: italic;
  color: #555;
  font-size: 14px;
}
.latin-toggle {
  margin-left: auto;
  font-size: 12px;
  color: var(--primary);
  background: none;
  border: none;
  cursor: pointer;
}
.bookmark-btn {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: #ccc;
  margin-left: 8px;
}
.bookmark-btn.active { color: #f4b400; }
nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--nav-height);
  background: white;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 100;
}
nav button {
  background: none;
  border: none;
  font-size: 11px;
  color: #888;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
nav button.active { color: var(--primary); }
#content { min-height: calc(100vh - 130px); }
</style>
</head>
<body>

<header>
  <h1>Codice di Diritto Canonico</h1>
  <p>Indice e Canoni</p>
</header>

<div class="search-box">
  <input type="text" id="search" placeholder="Cerca canone..." oninput="filterCanons()">
</div>

<div class="lang-switcher">
  <button class="lang-btn active" data-lang="it">Italiano</button>
  <button class="lang-btn" data-lang="la">Latina</button>
  <button class="lang-btn" data-lang="uk">Українська</button>
</div>

<div id="content"></div>

<nav>
  <button onclick="showIndice()" class="active">Indice</button>
  <button onclick="showCanoni()">Canoni</button>
  <button onclick="showBookmarks()">Segnalibri</button>
</nav>

<script>
let allCanons = [];
let currentLang = 'it';
let bookmarks = JSON.parse(localStorage.getItem('bookmarks') || '[]');
let currentFilter = { from: null, to: null, title: null };

async function loadData() {
  try {
    const res = await fetch('data/libro1.json');
    allCanons = await res.json();
    showIndice();
  } catch (e) {
    document.getElementById('content').innerHTML = '<p style="text-align:center;padding:40px;">Errore nel caricamento dei dati.</p>';
  }
}

function showIndice() {
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.querySelector('nav button:nth-child(1)').classList.add('active');
  document.getElementById('content').innerHTML = `
    <div style="padding:20px;text-align:center;">
      <h2 style="color:var(--primary);margin-bottom:20px;">Libro I — Norme generali</h2>
      <div onclick="showSection(7,22,'Titolo I. Le leggi ecclesiastiche (7–22)')" style="padding:14px;background:white;margin:8px 0;border-radius:10px;cursor:pointer;">Titolo I. Le leggi ecclesiastiche (7–22)</div>
      <div onclick="showSection(23,28,'Titolo II. La consuetudine (23–28)')" style="padding:14px;background:white;margin:8px 0;border-radius:10px;cursor:pointer;">Titolo II. La consuetudine (23–28)</div>
      <!-- Додай інші титули за потреби -->
    </div>
  `;
}

function showSection(from, to, title) {
  currentFilter = { from, to, title };
  showCanoni();
}

function showCanoni() {
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.querySelector('nav button:nth-child(2)').classList.add('active');
  renderCanons(getFilteredCanons());
}

function showBookmarks() {
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.querySelector('nav button:nth-child(3)').classList.add('active');
  const list = allCanons.filter(c => bookmarks.includes(c.num));
  currentFilter = { from: null, to: null, title: 'Segnalibri' };
  renderCanons(list);
}

function getFilteredCanons() {
  let list = allCanons;
  if (currentFilter.from && currentFilter.to) {
    list = list.filter(c => c.num >= currentFilter.from && c.num <= currentFilter.to);
  }
  const q = document.getElementById('search').value.toLowerCase();
  if (q) {
    list = list.filter(c => 
      c.num.toString().includes(q) || 
      (c[currentLang] || c.it || '').toLowerCase().includes(q)
    );
  }
  return list;
}

function renderCanons(list) {
  const container = document.getElementById('content');
  container.innerHTML = '';

  if (currentFilter.title) {
    const h = document.createElement('div');
    h.className = 'section-header';
    h.textContent = currentFilter.title;
    container.appendChild(h);
  }

  list.forEach(canon => {
    const card = document.createElement('div');
    card.className = 'canon-card';
    const isBookmarked = bookmarks.includes(canon.num);

    card.innerHTML = `
      <div class="canon-header" onclick="this.parentElement.classList.toggle('open')">
        <span>Can. ${canon.num}</span>
        <button class="bookmark-btn ${isBookmarked ? 'active' : ''}" onclick="event.stopPropagation(); toggleBookmark(${canon.num}, this)">★</button>
        <button class="latin-toggle" onclick="event.stopPropagation(); toggleLatin(this)">+ Lat</button>
      </div>
      <div class="canon-body">
        <div>${canon[currentLang] || canon.it || ''}</div>
        <div class="latin-text"><strong>Latine:</strong><br>${canon.la || ''}</div>
      </div>
    `;
    container.appendChild(card);
  });
}

function toggleLatin(btn) {
  const latin = btn.closest('.canon-card').querySelector('.latin-text');
  const isHidden = latin.style.display !== 'block';
  latin.style.display = isHidden ? 'block' : 'none';
  btn.textContent = isHidden ? '− Lat' : '+ Lat';
}

function toggleBookmark(num, btn) {
  const i = bookmarks.indexOf(num);
  if (i > -1) {
    bookmarks.splice(i, 1);
    btn.classList.remove('active');
  } else {
    bookmarks.push(num);
    btn.classList.add('active');
  }
  localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
}

function filterCanons() {
  if (document.querySelector('nav button.active').textContent.includes('Canoni') || 
      document.querySelector('nav button.active').textContent.includes('Segnalibri')) {
    renderCanons(getFilteredCanons());
  }
}

document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentLang = btn.dataset.lang;
    if (document.getElementById('content').querySelector('.canon-card')) {
      renderCanons(getFilteredCanons());
    }
  };
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

loadData();
</script>
</body>
</html>
